<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>景区离线素材 Demo</title>
<style>
body{font:15px system-ui,-apple-system,sans-serif;background:#f4f6fa;color:#202939;margin:0}main{max-width:880px;margin:35px auto;padding:0 18px}
.card{background:white;border:1px solid #e4e8f0;border-radius:14px;padding:20px;margin:15px 0}
h1{font-size:24px}h2{font-size:17px;margin:0 0 14px}label{display:block;margin:12px 0 6px}
select,input,button{font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:8px}
select{width:100%;background:white}input[type=text],input[type=number]{box-sizing:border-box;width:100%}
button{background:#1468d4;color:white;border:0;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}.muted{color:#687386;font-size:13px}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid #e9edf3;padding:10px 0}
.item div{min-width:0;overflow-wrap:anywhere}.small{padding:6px 10px;background:#e9eef6;color:#28394e}
.actions{display:flex;gap:6px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.fields{grid-template-columns:1fr}}
pre{background:#132235;color:#cfe7ff;padding:16px;border-radius:8px;max-height:350px;overflow:auto}
</style>
<main>
<h1>景区离线素材管理 Demo</h1>
<p class="muted">SQLite → 景区 → 站点 → 分类 → 素材 → 发布 manifest.json。示例无登录鉴权，只能用于本机或可信测试网络。</p>
<section class="card"><h2>1. 选择景区和站点</h2>
<label>景区</label><select id="scenic"></select>
<label>站点</label><select id="station"></select></section>
<section class="card"><h2>2. 素材分类管理（所有景区共用）</h2>
<div id="categoryRows"></div>
<div class="fields">
  <div><label>分类编码（创建后不可修改）</label><input id="catCode" type="text" placeholder="background_music"></div>
  <div><label>分类名称</label><input id="catName" type="text" placeholder="背景音乐"></div>
  <div><label>文件媒体类型</label><select id="catType"><option value="image">图片</option><option value="audio">音频</option><option value="video">视频</option></select></div>
  <div><label>排序（留空自动排到最后）</label><input id="catPosition" type="number" min="1" placeholder="自动"></div>
</div>
<p><button id="saveCategory">新增分类</button> <button class="small" id="cancelCategory" hidden>取消编辑</button></p>
<p class="muted">分类编码用于业务识别，建议创建后不修改。删除前需要先移除所有引用。新增空分类不会出现在车机清单中；给站点上传该分类的素材并发布后才会出现。</p>
</section>
<section class="card"><h2>3. 当前站点素材</h2><div id="materials"></div>
<h2>新增素材</h2><label>素材分类</label><select id="category"></select>
<label>标题</label><input id="title" type="text" placeholder="例如：中文讲解">
<label>文件（图片 / 音频 / 视频）</label><input id="file" type="file" accept="image/*,audio/*,video/*">
<p class="muted" id="typeHelp"></p>
<p><button id="upload">上传素材（尚未发布）</button></p></section>
<section class="card"><h2>4. 发布当前景区</h2>
<p>发布才会更新对车机可见的 JSON。后续车机比较 SHA-256，只下载新文件。</p>
<button id="publish">发布新版本</button> <a id="manifestLink" target="_blank">查看已发布 JSON</a>
<p id="message" class="muted"></p><pre id="preview"></pre></section>
</main>
<script src="/app.js"></script>
</html>
